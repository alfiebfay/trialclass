<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maketto · Seafood Menu Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7FAFB; --ivory2:#EDF4F6; --card:#FFFFFF;
  --ocean:#0C4A6E; --ocean-d:#072F48; --ocean-light:#1B6B8F; --ocean-mist:#DCEBF2;
  --coral:#E07A5F; --coral-d:#C56347; --coral-soft:#FCE8E1;
  --gold:#F5A623; --gold-d:#D48F1A; --gold-soft:#FFF3D6;
  --herb:#5A9A82; --herb-soft:#E4F0EB;
  --wood:#A06844; --wood-soft:#F3EAE2;
  --ink:#1A3A4A; --ink2:#5B7A8A; --ink3:#9FB3BE;
  --line:#D8E4EA; --line2:#BFD4DE;
  --sh:0 1px 2px rgba(12,74,110,.06),0 8px 24px rgba(12,74,110,.08);
  --sh-lg:0 2px 6px rgba(12,74,110,.08),0 20px 48px rgba(12,74,110,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--ivory);color:var(--ink);font-family:'Inter','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
body{background:radial-gradient(ellipse at 15% -5%,#C4E0EC 0%,transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(12,74,110,.25) 0%,transparent 45%),radial-gradient(ellipse at 0% 100%,rgba(160,104,68,.12) 0%,transparent 50%),linear-gradient(180deg,#F7FAFB 0%,#E4F0F5 100%);background-attachment:fixed}
.en{font-family:'Fraunces',serif;font-style:italic;font-weight:500;opacity:.8}
.es{font-family:'Fraunces',serif;font-style:italic;color:var(--ink3);font-weight:500}
.bi-en{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px;font-family:'Fraunces',serif;font-style:italic}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,47,72,.94);backdrop-filter:blur(12px);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;color:#fff;border-bottom:1px solid rgba(245,166,35,.2)}
.tb-brand{display:flex;align-items:center;gap:12px;font-family:'Fraunces','Noto Serif SC',serif;font-weight:900;font-size:20px}
.tb-brand .logo{width:34px;height:34px;background:linear-gradient(135deg,var(--coral) 0%,var(--coral-d) 100%);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 3px 10px rgba(224,122,95,.35)}
.tb-brand span b{color:var(--gold)}
.tb-quarter{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-left:8px}
.tb-reset{font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;background:none;border:none;padding:6px 12px;border-radius:8px}
.tb-reset:hover{background:rgba(255,255,255,.1);color:#fff}

/* ============ PROGRESS ============ */
.q-progress{position:sticky;top:62px;z-index:50;background:rgba(7,47,72,.85);backdrop-filter:blur(10px);padding:10px 40px;display:flex;align-items:center}
.qp-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-right:14px}
.qp-dot{width:38px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);transition:.3s}
.qp-dot.done{background:var(--gold);border-color:var(--gold);color:var(--ocean-d)}
.qp-dot.active{background:var(--coral);border-color:var(--coral);color:#fff;transform:scale(1.08);box-shadow:0 0 18px rgba(224,122,95,.55)}
.qp-line{flex:0 0 18px;height:1.5px;background:rgba(255,255,255,.15);margin:0 2px}
.qp-line.done{background:var(--gold)}

.wrap{max-width:1180px;margin:0 auto;padding:32px 32px 60px}

/* ============ BUTTONS ============ */
.btn-card{background:var(--card);color:var(--ocean);border:1.5px solid var(--line);padding:10px 18px;font-size:13px;border-radius:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.btn-card:hover{background:var(--ocean-mist);border-color:var(--ocean)}
.btn-submit{background:linear-gradient(135deg,var(--coral) 0%,var(--coral-d) 100%);color:#fff;padding:16px 48px;border-radius:16px;font-weight:700;border:none;cursor:pointer;font-size:15px;box-shadow:0 8px 24px rgba(224,122,95,.32);transition:.2s;font-family:inherit}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(224,122,95,.42)}
.btn-submit:disabled{background:#B0BEC5;cursor:not-allowed;box-shadow:none;transform:none}

/* ============ INTRO ============ */
.intro-hero{background:linear-gradient(135deg,rgba(7,47,72,.88) 0%,rgba(12,74,110,.72) 55%,rgba(7,47,72,.55) 100%),url('./maketto-bg/S2-hero.png') center/cover no-repeat;color:#fff;padding:60px 54px;border-radius:28px;position:relative;overflow:hidden;box-shadow:var(--sh-lg);min-height:330px;display:flex;flex-direction:column;justify-content:center}
.ih-kick{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.85;font-weight:600}
.ih-title{font-family:'Fraunces','Noto Serif SC',serif;font-size:48px;font-weight:900;line-height:1.1;margin:12px 0 6px;text-shadow:0 2px 24px rgba(0,0,0,.3)}
.ih-title .en-sub{display:block;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:22px;opacity:.9;margin-top:8px}
.ih-desc{font-size:15px;max-width:640px;opacity:.95;line-height:1.75;margin-top:14px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.ih-desc b{color:var(--gold)}

.goal-card{background:linear-gradient(135deg,var(--gold-soft) 0%,#FEF9E2 100%);border:2px solid var(--gold);border-radius:18px;padding:18px 22px;margin-top:22px;display:flex;align-items:center;gap:18px}
.gc-left{flex:1}
.gc-title{font-family:'Fraunces','Noto Serif SC',serif;font-size:16px;font-weight:700;color:#5A4300;margin-bottom:4px}
.gc-desc{font-size:12.5px;color:#7B5E00;line-height:1.6}
.gc-right{text-align:center}
.gc-target-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7B5E00;font-weight:600}
.gc-target{font-family:'Fraunces',serif;font-size:38px;font-weight:900;color:#5A4300;line-height:1}
.gc-target-sub{font-size:10px;color:#8B7300;margin-top:2px}

.intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.intro-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh);transition:.2s}
.intro-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.intro-card .num{font-family:'Fraunces',serif;font-size:34px;font-weight:900;color:var(--ocean);line-height:1}
.intro-card h3{font-family:'Fraunces','Noto Serif SC',serif;font-size:16px;font-weight:700;margin:8px 0 4px}
.intro-card p{font-size:12.5px;color:var(--ink2);line-height:1.65}
.intro-cta{margin-top:28px;text-align:center}

/* ============ RULES PAGE ============ */
.rules-hero{background:linear-gradient(135deg,rgba(7,47,72,.9) 0%,rgba(12,74,110,.75) 100%),url('./maketto-bg/S1-bar.png') center/cover no-repeat;color:#fff;border-radius:24px;padding:40px 44px;box-shadow:var(--sh-lg)}
.rules-hero h1{font-family:'Fraunces','Noto Serif SC',serif;font-size:32px;font-weight:900;margin-top:6px}
.rules-hero p{font-size:13.5px;opacity:.92;margin-top:8px;max-width:700px;line-height:1.7}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.rule-card.span2{grid-column:1/-1}
.money-row{display:grid;grid-template-columns:1fr 270px;gap:22px;align-items:center}
.money-row .rc-ex{margin-top:0}
.rule-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.rule-card.dark{background:linear-gradient(160deg,var(--ocean-d) 0%,var(--ocean) 100%);color:#fff;border:none}
.rc-num{font-family:'Fraunces',serif;font-size:11px;letter-spacing:2px;font-weight:700;opacity:.55;text-transform:uppercase}
.rule-card h3{font-family:'Fraunces','Noto Serif SC',serif;font-size:17px;font-weight:700;margin:4px 0 6px}
.rule-card p{font-size:12.5px;color:var(--ink2);line-height:1.7}
.rule-card.dark p{color:rgba(255,255,255,.85)}
.rc-formula{background:var(--ocean-mist);border-radius:10px;padding:10px 12px;margin-top:10px;font-family:'Fraunces',serif;font-size:13px;font-weight:700;color:var(--ocean)}
.rule-card.dark .rc-formula{background:rgba(255,255,255,.12);color:var(--gold)}
.rule-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.rule-item:last-child{border-bottom:none}
.rule-item .ri-n{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--ocean);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif}
.rule-item .ri-t{font-size:12.5px;font-weight:700}
.rule-item .ri-d{font-size:11px;color:var(--ink3);line-height:1.5}
.rule-card.dark .rule-item{border-color:rgba(255,255,255,.15)}
.rule-card.dark .ri-n{background:var(--gold);color:var(--ocean-d)}
.rule-card.dark .ri-d{color:rgba(255,255,255,.65)}
.notice-bar{background:linear-gradient(135deg,var(--coral-soft) 0%,#FFF1EC 100%);border:1.5px solid #F0B8A0;border-radius:14px;padding:14px 18px;margin-top:16px;font-size:12.5px;color:#8A3D28;line-height:1.7}
.notice-bar b{color:var(--coral-d)}

/* ============ RULES: 图片条 + 基础/进阶切换 ============ */
.mode-switch{display:flex;gap:6px;margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh)}
.mode-btn{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink3);padding:9px 10px 7px;border-radius:11px;cursor:pointer;transition:.2s;line-height:1.25}
.mode-btn small{display:block;font-size:9px;font-weight:500;opacity:.75;margin-top:1px;font-family:'Fraunces',serif;font-style:italic}
.mode-btn.active{background:linear-gradient(135deg,var(--ocean) 0%,var(--ocean-d) 100%);color:#fff;box-shadow:0 4px 14px rgba(12,74,110,.28)}
.mode-btn:hover:not(.active){background:var(--ocean-mist);color:var(--ocean)}

.cat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.cat-tile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;box-shadow:var(--sh);border:1.5px solid var(--line)}
.cat-tile img{width:100%;height:100%;object-fit:contain;background:#F5EFE4;display:block;transition:.4s}
.cat-tile:hover img{transform:scale(1.05)}
.ct-label{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(0deg,rgba(7,47,72,.92) 0%,rgba(7,47,72,.35) 60%,transparent 100%);color:#fff}
.ct-label b{font-size:12px;display:block;font-weight:700}
.ct-label span{font-size:9px;opacity:.8;font-family:'Fraunces',serif;font-style:italic}

.adv-only{display:none}
body.rules-adv .adv-only{display:block}
.adv-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.adv-table td{padding:5px 4px;border-bottom:1px dashed var(--line);color:var(--ink2)}
.adv-table tr:last-child td{border-bottom:none}
.adv-table td:last-child{text-align:right;font-family:'Fraunces',serif;font-weight:700;color:var(--ocean);white-space:nowrap}
.rule-card.dark .adv-table td{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.18)}
.rule-card.dark .adv-table td:last-child{color:var(--gold)}
.rc-ex{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px;margin-top:12px}
.rc-ex img{width:54px;height:54px;border-radius:9px;object-fit:contain;background:#F5EFE4;flex-shrink:0}
.money-row{display:grid;grid-template-columns:1fr 240px;gap:22px;align-items:center}
.money-flow{display:flex;align-items:stretch;gap:4px;margin-top:14px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
.mf-cost{flex:7;background:linear-gradient(135deg,#B33A3A 0%,#8B1C1C 100%);padding:12px;color:#fff;text-align:center}
.mf-margin{flex:8;background:linear-gradient(135deg,#4EA56F 0%,#2F7D4C 100%);padding:12px;color:#fff;text-align:center}
.mf-v{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
.mf-lbl{font-size:8px;letter-spacing:1px;text-transform:uppercase;margin-top:4px;opacity:.8}
.mf-sep{display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.7);font-weight:700;background:rgba(0,0,0,.15);width:30px;flex-shrink:0}
.mf-price{display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);width:50px;flex-shrink:0}
.rc-hero{width:240px;height:190px;object-fit:contain;background:rgba(255,255,255,.08);border-radius:14px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.rc-ex .t{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.85)}
.rc-ex .t b{color:#fff}
.rc-ex .t .n{color:var(--gold);font-weight:700;font-family:'Fraunces',serif;font-size:14px}
.mix-bar{display:flex;border-radius:9px;overflow:hidden;margin-top:14px;font-size:9.5px;font-weight:700;color:#fff;text-align:center;line-height:26px}
.mix-bar div{white-space:nowrap;overflow:hidden}

/* ============ DECISION 3-COLUMN ============ */
.decision-layout{display:grid;grid-template-columns:300px 1fr 320px;gap:16px;margin-top:16px;align-items:start}
.decision-layout > .left-col,.decision-layout > .product-tray{position:sticky;top:130px}
.quarter-banner{border-radius:18px;padding:18px;box-shadow:var(--sh-lg);overflow:hidden;position:relative;color:#fff;background:linear-gradient(135deg,rgba(7,47,72,.9) 0%,rgba(12,74,110,.78) 100%),url('./maketto-bg/S2-quarters.png') center/cover no-repeat}
.qb-season{font-family:'Fraunces',serif;font-size:10px;font-style:italic;opacity:.8;letter-spacing:2px;text-transform:uppercase}
.qb-name{font-family:'Fraunces','Noto Serif SC',serif;font-size:20px;font-weight:900;margin:2px 0;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.qb-name .es{color:rgba(255,255,255,.6)}
.qb-brief{font-size:11px;line-height:1.6;opacity:.93;margin-top:8px;border-left:2px solid var(--gold);padding-left:8px}
.qb-brief .bi-en{color:rgba(255,255,255,.6);font-size:9.5px}
.qb-hints{margin-top:10px}
.qb-hint{display:flex;gap:6px;align-items:flex-start;background:rgba(7,47,72,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 8px;margin-bottom:5px}
.qb-hint .hi-n{font-size:9px;color:var(--gold);font-weight:700;margin-top:1px;font-family:'Fraunces',serif}
.qb-hint .hi-t{font-size:10px;line-height:1.45}
.qb-hint .hi-en{display:block;font-size:8.5px;color:rgba(255,255,255,.55);font-style:italic;font-family:'Fraunces',serif;margin-top:1px}
.qb-stats{display:flex;gap:6px;margin-top:10px}
.qb-stat{flex:1;background:rgba(7,47,72,.5);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px;text-align:center}
.qb-stat .v{font-family:'Fraunces',serif;font-size:15px;font-weight:700}
.qb-stat .l{font-size:7.5px;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.event-note{background:linear-gradient(135deg,rgba(224,122,95,.18) 0%,rgba(224,122,95,.06) 100%);border:1px solid rgba(224,122,95,.45);border-radius:10px;padding:9px 10px;margin-top:10px;font-size:10.5px;line-height:1.5}
.event-note b{color:var(--gold)}

/* 当季热门缩略图 */
.qb-sec{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-top:10px;font-weight:700}
.qb-hots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.qb-hot{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:1;border:1px solid rgba(255,255,255,.18)}
.qb-hot img{width:100%;height:100%;object-fit:contain;background:#F5EFE4;display:block}
.qb-hot span{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;padding:8px 3px 3px;background:linear-gradient(0deg,rgba(7,47,72,.95),transparent);text-align:center;line-height:1.2}

/* ============ ADVISOR ============ */
.advisor{display:flex;gap:16px;background:linear-gradient(135deg,#FFFDF6 0%,#FFF7E2 100%);border:1.5px solid #F3D48A;border-left:6px solid var(--gold);border-radius:18px;padding:20px 22px;margin-top:14px;box-shadow:var(--sh)}
.adv-avatar{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--ocean) 0%,var(--ocean-light) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 4px 14px rgba(12,74,110,.3)}
.adv-body{flex:1;min-width:0}
.adv-name{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#8B7300;font-weight:700}
.adv-say{font-family:'Fraunces','Noto Serif SC',serif;font-size:16px;font-weight:700;color:#4A3800;margin-top:4px;line-height:1.6}
.adv-say .hl{color:var(--coral-d)}
.adv-say .up{color:#3D6B58}
.adv-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.adv-col{background:rgba(255,255,255,.72);border:1px solid rgba(245,166,35,.3);border-radius:12px;padding:10px 12px}
.adv-col h5{font-size:10px;letter-spacing:1px;font-weight:700;margin-bottom:5px}
.adv-col.good h5{color:#3D6B58}
.adv-col.bad h5{color:var(--coral-d)}
.adv-li{display:flex;gap:7px;font-size:11.5px;color:var(--ink2);padding:3px 0;line-height:1.5}
.adv-li b{color:var(--ink)}
.adv-li .dot{flex-shrink:0;font-size:9px;margin-top:4px}
.adv-thumbs{display:flex;gap:6px;margin-top:11px;align-items:center}
.adv-thumb{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#F5EFE4;border:2px solid #fff;box-shadow:0 2px 8px rgba(12,74,110,.16)}
.adv-thumb-cap{font-size:9.5px;color:#8B7300;margin-left:4px;font-style:italic;font-family:'Fraunces',serif}

/* 自检清单：无自动判定 */
.self-check{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);margin-top:12px}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:1.5px dashed var(--line);margin-bottom:6px}
.sc-head .t{font-family:'Fraunces','Noto Serif SC',serif;font-size:12.5px;font-weight:700;color:var(--ocean)}
.sc-head .n{font-size:9px;color:var(--ink3);letter-spacing:1px}
.sc-item{display:flex;gap:7px;font-size:11.5px;color:var(--ink2);padding:4px 0}
.sc-item .box{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:3px;flex-shrink:0;margin-top:3px}
.sc-note{font-size:9.5px;color:var(--ink3);margin-top:6px;font-style:italic}

.side-goal{background:linear-gradient(135deg,var(--gold-soft) 0%,#FEF5D0 100%);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:12px}
.side-goal .sg-title{font-size:10px;font-weight:700;color:#7B5E00;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.side-goal .sg-target{font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:#5A4300}
.side-goal .sg-bar{margin-top:6px;height:6px;background:#F0E3A8;border-radius:3px;overflow:hidden}
.side-goal .sg-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .8s ease}
.side-goal .sg-league{font-size:10px;color:#7B5E00;margin-top:6px;text-align:center}

/* Slots */
.slots-center h3{font-family:'Fraunces','Noto Serif SC',serif;font-size:16px;font-weight:700;color:var(--ocean);margin-bottom:4px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:var(--card);border:2px dashed var(--line2);border-radius:14px;overflow:hidden;aspect-ratio:5/4;cursor:pointer;transition:.25s;position:relative;display:flex;flex-direction:column}
.slot.empty{align-items:center;justify-content:center}
.slot.empty:hover{border-color:var(--ocean);background:var(--ocean-mist)}
.slot.drag-over{border-color:var(--coral);background:var(--coral-soft);transform:scale(1.02);box-shadow:0 0 0 3px rgba(224,122,95,.25)}
.slot .slot-label{position:absolute;top:6px;left:8px;font-size:8px;font-weight:700;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;z-index:2;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:4px}
.slot.empty .slot-icon{font-size:28px;opacity:.45}
.slot.empty .slot-num{font-family:'Fraunces',serif;font-size:11px;color:var(--ink3);margin-top:4px}
.slot.filled{border-style:solid;border-color:var(--line)}
.slot.filled:hover{border-color:var(--coral);transform:translateY(-1px)}
.slot.filled .slot-img{width:100%;flex:1;object-fit:contain;background:#F5EFE4;min-height:0}
.slot.filled .slot-info{padding:5px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--card)}
.slot.filled .slot-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.slot.filled .slot-margin{font-family:'Fraunces',serif;color:var(--herb);font-size:11px;font-weight:700}
.slot.filled .slot-remove{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--coral);color:#fff;border:none;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3}
.slot.filled:hover .slot-remove{display:flex}
@keyframes slotIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.slot.just-dropped{animation:slotIn .35s ease}

.cost-changes{background:var(--ocean-mist);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.cost-changes h5{font-size:10px;font-weight:700;color:var(--ocean);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.cc-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px}
.cc-row .prod{flex:1}
.cc-row .delta{font-family:'Fraunces',serif;font-weight:700;min-width:48px;text-align:right}
.cc-row .delta.up{color:var(--coral-d)}
.cc-row .delta.down{color:var(--herb)}

.decision-actions{margin-top:16px;display:flex;gap:10px;justify-content:flex-end}

/* Product tray */
.product-tray{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh);max-height:calc(100vh - 150px);overflow-y:auto}
.product-tray h4{font-family:'Fraunces','Noto Serif SC',serif;font-size:13px;font-weight:700;color:var(--ocean);margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid var(--line)}
.pt-category{margin-bottom:10px}
.pt-cat-name{font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.pt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pt-item{background:var(--ivory2);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:grab;transition:.2s;display:flex;gap:6px;align-items:center}
.pt-item:hover{border-color:var(--ocean);background:var(--ocean-mist);transform:translateY(-1px);box-shadow:0 4px 12px rgba(12,74,110,.15)}
.pt-item:active{cursor:grabbing}
.pt-item.dragging{opacity:.35;cursor:grabbing}
.pt-item.used{opacity:.32;cursor:not-allowed;border-style:dashed}
.pt-item img{width:34px;height:34px;border-radius:7px;object-fit:contain;background:#F5EFE4;flex-shrink:0}
.pt-item .pt-info{flex:1;min-width:0}
.pt-item .pt-name{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-item .pt-meta{font-size:9px;color:var(--ink3);font-family:'Fraunces',serif;white-space:nowrap}
.pt-item .pt-meta b{color:var(--herb);font-weight:700}
.pt-item .pt-stars{font-size:8px;color:var(--gold);letter-spacing:1px;line-height:1}
.product-tray::-webkit-scrollbar{width:6px}
.product-tray::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* ============ SETTLE ============ */
.settle-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.st-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.st-card.kpi{background:linear-gradient(135deg,rgba(7,47,72,.88) 0%,rgba(12,74,110,.72) 100%),url('./maketto-bg/S1-detail.png') center/cover no-repeat;color:#fff;border:none}
.st-card.kpi .st-label{opacity:.85;color:#fff}
.st-card.kpi .st-value{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.st-card.kpi .st-sub{color:rgba(255,255,255,.8)}
.st-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink2);font-weight:700}
.st-value{font-family:'Fraunces','Noto Serif SC',serif;font-size:40px;font-weight:900;margin-top:4px;color:var(--ocean);line-height:1}
.st-sub{font-size:11px;color:var(--ink3);margin-top:6px}

.settle-section{margin-top:22px}
.ss-title{font-family:'Fraunces','Noto Serif SC',serif;font-size:17px;font-weight:700;margin-bottom:12px;color:var(--ocean);display:flex;align-items:center;gap:8px}
.ss-title::before{content:"";width:4px;height:22px;background:linear-gradient(180deg,var(--ocean),var(--coral));border-radius:2px}

.segments{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seg-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--sh);transition:.3s}
.seg-card.active{background:linear-gradient(180deg,var(--herb-soft) 0%,var(--card) 100%);border-color:var(--herb)}
.seg-card.lost{background:#FCE8E1;border-color:#F0B8A0}
.seg-emoji{font-size:26px;margin-bottom:2px}
.seg-name{font-size:12px;font-weight:700}
.seg-cn{font-size:10px;color:var(--ink3);font-family:'Fraunces',serif;font-style:italic;margin-top:1px}
.seg-count{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-top:4px;line-height:1}
.seg-card.active .seg-count{color:var(--herb)}
.seg-card.lost .seg-count{color:var(--coral-d)}
.seg-reason{font-size:9.5px;margin-top:4px;line-height:1.4;min-height:14px}
.seg-card.active .seg-reason{color:var(--herb)}
.seg-card.lost .seg-reason{color:var(--coral-d)}
.seg-bar{margin-top:8px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.seg-bar-fill{height:100%;border-radius:2px;transition:width 1s ease}
.seg-card.active .seg-bar-fill{background:var(--herb)}
.seg-card.lost .seg-bar-fill{background:var(--coral)}

.bar-chart{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh);margin-top:12px}
.bar-chart h4{font-size:11px;font-weight:700;color:var(--ocean);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.bars-wrap{display:flex;align-items:flex-start;gap:12px;height:240px;padding:10px 10px 0;border-bottom:2px solid var(--line);position:relative}
.bars-wrap::before{content:"";position:absolute;left:0;right:0;top:30px;border-top:1px dashed var(--line2);opacity:.5}
.bars-wrap::after{content:"";position:absolute;left:0;right:0;top:70px;border-top:1px dashed var(--line2);opacity:.5}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar{width:100%;max-width:56px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--ocean-light) 0%,var(--ocean) 100%);transition:height 1.1s cubic-bezier(.22,.61,.36,1);box-shadow:0 2px 8px rgba(12,74,110,.2);position:relative;margin-top:auto}
.bar.is-best{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-d) 100%);box-shadow:0 2px 12px rgba(245,166,35,.45)}
.bar-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:'Fraunces',serif;font-size:12px;font-weight:700;color:var(--ocean);white-space:nowrap;background:rgba(255,255,255,.85);padding:1px 4px;border-radius:4px}
.bar.is-best .bar-value{color:var(--gold-d);background:rgba(255,253,220,.9)}
.bar-label{font-size:9px;color:var(--ink2);margin-top:8px;text-align:center;max-width:100%;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-rev{font-family:'Fraunces',serif;font-size:9px;color:var(--herb);font-weight:700;margin-top:1px;white-space:nowrap}

/* WHY cards */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.why-card{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;padding:10px;display:flex;gap:9px;box-shadow:var(--sh)}
.why-card.good{border-left-color:var(--herb)}
.why-card.bad{border-left-color:var(--coral)}
.why-card.mid{border-left-color:var(--gold)}
.why-card img{width:46px;height:46px;border-radius:8px;object-fit:contain;background:#F5EFE4;flex-shrink:0}
.wc-main{flex:1;min-width:0}
.wc-top{display:flex;align-items:center;gap:6px}
.wc-name{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-badge{font-size:8px;font-weight:700;padding:1px 6px;border-radius:20px;flex-shrink:0;letter-spacing:.5px}
.wc-badge.good{background:var(--herb-soft);color:#3D6B58}
.wc-badge.bad{background:var(--coral-soft);color:var(--coral-d)}
.wc-badge.mid{background:var(--gold-soft);color:#8B7300}
.wc-es{font-size:8.5px;color:var(--ink3);font-family:'Fraunces',serif;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-stat{font-size:9.5px;color:var(--ink2);font-family:'Fraunces',serif;margin-top:2px}
.wc-reason{font-size:10px;color:var(--ink2);line-height:1.45;margin-top:3px}
.wc-reason-en{font-size:8.5px;color:var(--ink3);line-height:1.4;font-style:italic;font-family:'Fraunces',serif}

/* LESSON cards */
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lesson-card{background:linear-gradient(160deg,var(--ocean-d) 0%,var(--ocean) 100%);color:#fff;border-radius:16px;padding:18px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.lesson-card.core{background:linear-gradient(160deg,#8A5A00 0%,#B8791A 100%)}
.lc-tag{display:inline-block;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.16);margin-bottom:8px}
.lc-title{font-family:'Fraunces','Noto Serif SC',serif;font-size:15px;font-weight:700;line-height:1.35}
.lc-title .en{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.lc-body{font-size:11.5px;line-height:1.65;margin-top:8px;opacity:.92}
.lc-body .bi-en{color:rgba(255,255,255,.6);font-size:9.5px;margin-top:4px}
.lc-star{position:absolute;right:12px;top:10px;font-size:26px;opacity:.18}

.slot-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-top:14px}
.slot-table th,.slot-table td{padding:10px 12px;text-align:left;font-size:12px;border-bottom:1px solid var(--line)}
.slot-table th{background:var(--ocean-mist);font-weight:600;color:var(--ocean);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.slot-table tr:last-child td{border-bottom:none}
.slot-table td.num{font-family:'Fraunces',serif;font-weight:700;text-align:right}
.slot-table td.pos{color:var(--herb)}
.slot-table td.neg{color:var(--coral)}
.slot-table .highlight-row td{background:var(--gold-soft);font-weight:700}
.slot-table td.p-img-cell{width:44px;padding:3px 6px}
.slot-table td.p-img-cell img{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#F5EFE4;border:1px solid var(--line)}

.settle-actions{margin-top:24px;text-align:center}

/* ============ FINALE ============ */
.finale-hero{background:linear-gradient(135deg,rgba(7,20,32,.9) 0%,rgba(12,40,60,.78) 60%,rgba(7,20,32,.65) 100%),url('./maketto-bg/S4-hero.png') center/cover no-repeat;color:#fff;border-radius:24px;padding:52px 48px;box-shadow:var(--sh-lg);margin-top:12px;text-align:center}
.fh-kick{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.7;font-weight:700}
.fh-title{font-family:'Fraunces','Noto Serif SC',serif;font-size:36px;font-weight:900;margin:6px 0 2px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.fh-sub{font-family:'Fraunces',serif;font-style:italic;font-weight:500;opacity:.85;font-size:16px}
.fh-reward{margin:20px 0}
.fh-medal{display:inline-block;font-size:60px;filter:drop-shadow(0 4px 20px rgba(245,166,35,.55))}
.fh-league{font-family:'Fraunces','Noto Serif SC',serif;font-size:26px;font-weight:900;color:var(--gold);margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.fh-league-sub{font-size:13px;opacity:.85;margin-top:4px}
.fh-kpi{display:flex;gap:28px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);justify-content:center}
.fh-kpi-item .v{font-family:'Fraunces','Noto Serif SC',serif;font-size:46px;font-weight:900;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.fh-kpi-item .l{font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-top:4px}
.fh-kpi-item.best .v{color:var(--gold)}

.league-ladder{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-top:20px;box-shadow:var(--sh)}
.league-ladder h4{font-size:12px;font-weight:700;color:var(--ocean);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.ladder-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:6px;border:1.5px solid var(--line);background:var(--ivory2)}
.ladder-row.current{background:linear-gradient(135deg,var(--gold-soft) 0%,#FEF5D0 100%);border-color:var(--gold);box-shadow:0 4px 16px rgba(245,166,35,.25)}
.ladder-medal{font-size:22px}
.ladder-name{flex:1;font-weight:700;font-size:13px}
.ladder-en{font-size:10px;font-style:italic;font-family:'Fraunces',serif;color:var(--ink3);font-weight:500;margin-left:4px}
.ladder-target{font-family:'Fraunces',serif;font-weight:700;font-size:12px;color:var(--ocean)}
/* 横向奖章阶梯 */
.ladder-bar{display:flex;align-items:stretch;gap:0;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.ladder-connector{flex:0 0 32px;display:flex;align-items:center}
.ladder-connector::before{content:"";flex:1;height:3px;background:var(--line);border-radius:2px}
.ladder-node{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:88px;padding:14px 8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--ivory2);position:relative;transition:.2s}
.ladder-node.reached{background:linear-gradient(180deg,#FEF9E7 0%,#FFFDF4 100%);border-color:rgba(245,166,35,.4)}
.ladder-node.active{background:linear-gradient(135deg,#FFEFA0 0%,#F5A623 100%);border-color:var(--gold-d);box-shadow:0 8px 22px rgba(245,166,35,.45);transform:translateY(-4px);z-index:2}
.ladder-node.active .ln-title,.ladder-node.active .ln-medal,.ladder-node.active .ln-range{color:#4A2B00}
.ln-medal{font-size:28px;margin-bottom:4px;line-height:1;filter:grayscale(1) brightness(1.2)}
.ladder-node.reached .ln-medal{filter:none}
.ladder-node.active .ln-medal{font-size:34px;filter:none;animation:medalPulse 1.8s ease-in-out infinite}
@keyframes medalPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ln-title{font-size:11px;font-weight:700;color:var(--ocean);white-space:nowrap}
.ln-sub{font-size:8.5px;color:var(--ink3);margin-top:1px;font-family:'Fraunces',serif;font-style:italic;white-space:nowrap}
.ln-range{font-size:9px;font-weight:700;color:var(--herb);margin-top:6px;font-family:'Fraunces',serif;white-space:nowrap}

.q-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.qs-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.qs-qtr{font-family:'Fraunces',serif;font-size:10px;font-style:italic;color:var(--ocean);font-weight:700;letter-spacing:1px}
.qs-sname{font-family:'Fraunces','Noto Serif SC',serif;font-size:14px;font-weight:700;margin:2px 0}
.qs-rev{font-family:'Fraunces',serif;font-size:24px;font-weight:900;color:var(--ocean);margin-top:4px}
.qs-bar{margin-top:8px;height:50px;display:flex;align-items:flex-end}
.qs-bar-fill{width:100%;background:var(--ocean);border-radius:3px 3px 0 0;min-height:4px;transition:height 1.2s cubic-bezier(.22,.61,.36,1)}
.qs-lost{font-size:11px;color:var(--ink2);margin-top:4px}

.recap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.recap-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);border-left:4px solid var(--ocean)}
.recap-card h4{font-family:'Fraunces','Noto Serif SC',serif;font-size:13.5px;font-weight:700;color:var(--ocean)}
.recap-card p{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.65}
.recap-tag{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);font-weight:700}

.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.count-pop{animation:countPop .4s ease}
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.star-pop{animation:starPop .6s ease}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}

@media(max-width:1100px){
  .decision-layout{grid-template-columns:1fr}
  .decision-layout > .left-col,.decision-layout > .product-tray{position:static}
  .why-grid,.lesson-grid,.rules-grid,.cat-strip{grid-template-columns:repeat(2,1fr)}
  .settle-top{grid-template-columns:repeat(2,1fr)}
  .bar-item{flex:1 0 56px}
  .ladder-node{min-width:76px;padding:12px 5px 8px}
  .ln-medal{font-size:24px}
}
@media(max-width:820px){
  .segments,.q-summary,.recap-grid,.intro-grid{grid-template-columns:repeat(2,1fr)}
  .settle-top,.cat-strip{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(2,1fr)}
  .fh-title,.ih-title{font-size:28px}
  .fh-kpi{flex-direction:column;gap:12px}
  .bar-item{flex:1 0 42px}
  .bar{max-width:40px}
  .advisor{flex-direction:column;gap:12px}
  .adv-avatar{width:44px;height:44px;font-size:18px}
  .ladder-connector{flex-basis:18px}
  .ladder-node{min-width:64px;padding:10px 4px 6px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand"><span class="logo">🐟</span><span>Maketto<b> · </b><span id="tbQuarterSub">Product Mix Challenge</span></span></div>
  <button class="tb-reset" onclick="if(confirm('重新开始？')) resetGame()">↻ 重新开始</button>
</div>
<div class="q-progress" id="qProgress" style="display:none">
  <span class="qp-label">Quarters</span>
  <div class="qp-dot" id="qp1">Q1</div><div class="qp-line" id="qpl1"></div>
  <div class="qp-dot" id="qp2">Q2</div><div class="qp-line" id="qpl2"></div>
  <div class="qp-dot" id="qp3">Q3</div><div class="qp-line" id="qpl3"></div>
  <div class="qp-dot" id="qp4">Q4</div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */
const FOOD='./maketto-peru-food/';
const BG='./maketto-bg/';
const CATEGORIES=['fish','meat','starch','salad'];
const CAT_META={

/* ============ HELPERS ============ */
function productCat(p){for(const c of CATEGORIES){if(PRODUCTS[c].some(x=>x.id===p.id))return c}return null}
function hasFish(m){return m.some(p=>productCat(p)==='fish')}
function countFish(m){return m.filter(p=>productCat(p)==='fish').length}
function hasCat(m,cat){return m.some(p=>productCat(p)===cat)}
function hasAllCats(m){return CATEGORIES.every(c=>hasCat(m,c))}
function allProducts(){return Object.values(PRODUCTS).flat()}
function leagueFor(rev){return LEAGUES.find(l=>rev>=l.min&&rev<=l.max)||LEAGUES[0]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function priceFactor(price){return clamp(1-(price-13)*0.06,.40,1.50)}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

/* ============ ENGINE ============ */
function simulate(menu,season,adj=1){
  const flow=Math.round(BASE_FLOW*season.traffic*adj);
  const segRows=SEGMENTS.map(seg=>{
    const cnt=Math.round(flow*seg.pct);
    const sat=seg.ok(menu);
    return {seg,cnt:sat?cnt:0,lost:sat?0:cnt};
  });
  const weights=menu.map(p=>{
    const sm=(season.hot[p.id]||1)*(season.cold[p.id]||1);
    return p.pop*priceFactor(p.price)*sm;
  });
  const sales=menu.map(()=>0);
  const bySeg=menu.map(()=>SEGMENTS.map(()=>0));
  let active=0,lost=0;
  segRows.forEach((row,si)=>{
    if(!row.cnt){lost+=row.lost;return}
    active+=row.cnt;
    const ww=menu.map((p,i)=>weights[i]*(row.seg.pref[productCat(p)]||1));
    const tw=ww.reduce((a,b)=>a+b,0)||1;
    const raw=ww.map(x=>x/tw*row.cnt);
    const base=raw.map(Math.floor);
    let rem=row.cnt-base.reduce((a,b)=>a+b,0);
    const order=raw.map((v,i)=>({i,f:v-base[i]})).sort((a,b)=>b.f-a.f);
    for(let k=0;k<rem;k++)base[order[k%menu.length].i]++;
    base.forEach((v,i)=>{sales[i]+=v;bySeg[i][si]=v});
  });
  let net=-FIXED_COST;
  const rows=menu.map((p,i)=>{
    const cost=p.cost+(season.cost[p.id]||0);
    const margin=p.price-cost;
    const cont=margin*sales[i];
    net+=cont;
    return {prod:p,cost,margin,sales:sales[i],cont,bySeg:bySeg[i],weight:weights[i]};
  });
  return {flow,active,lost,segRows,sales,rows,net};
}

/* 支线：上一季表现影响本季客流 */
function scenarioFor(qi){
  const s=SEASONS[qi];
  let adj=1,ev=null;
  if(qi>0&&state.history.length>0){
    const prev=state.history[qi-1];
    if(prev.lost>0&&EVENTS[qi].weak){adj=.95;ev={...EVENTS[qi].weak,kind:'bad'}}
    else if(prev.net>=SEASONS[qi-1].strong&&EVENTS[qi].strong){adj=1.04;ev={...EVENTS[qi].strong,kind:'good'}}
  }
  return {adj,ev,flow:Math.round(BASE_FLOW*s.traffic*adj)};
}

/* 每道菜为什么好卖 / 卖不动 */
function explainSlots(res,season){
  const totalSales=res.sales.reduce((a,b)=>a+b,0)||1;
  const avg=totalSales/6;
  return res.rows.map(r=>{
    const p=r.prod,id=p.id;
    const pf=priceFactor(p.price);
    const isHot=!!season.hot[id],isCold=!!season.cold[id];
    const hotMult=season.hot[id]||1,coldMult=season.cold[id]||1;
    const domIdx=r.bySeg.indexOf(Math.max(...r.bySeg));
    const dom=SEGMENTS[domIdx];
    const domPct=Math.round(r.bySeg[domIdx]/(r.sales||1)*100);
    let verdict='mid',badge='一般',badgeEn='Average';
    if(r.sales===0){verdict='bad';badge='没人点';badgeEn='No orders'}
    else if(r.sales>=avg*1.15){verdict='good';badge='好卖';badgeEn='Strong'}
    else if(r.sales<=avg*0.65){verdict='bad';badge='卖不动';badgeEn='Slow'}
    const reasons=[];
    if(isHot) reasons.push({cn:`当季热门，需求被推高到 ${hotMult.toFixed(1)} 倍`,en:`In-season: demand boosted ×${hotMult.toFixed(1)}`});
    if(isCold) reasons.push({cn:`逆季菜品，本季需求只有 ${coldMult.toFixed(2)} 倍`,en:`Out of season: demand only ×${coldMult.toFixed(2)}`});
    if(pf<=.82) reasons.push({cn:`定价 $${p.price} 偏高，点单率被压低`,en:`Priced at $${p.price} — too high, fewer orders`});
    else if(pf>=1.18) reasons.push({cn:`价格亲民，点单率高`,en:'Friendly price — high order rate'});
    if(r.margin<=4) reasons.push({cn:`毛利薄：每份只赚 $${r.margin}`,en:`Thin margin: only $${r.margin} per plate`});
    else if(r.margin>=9) reasons.push({cn:`毛利厚：每份赚 $${r.margin}`,en:`Fat margin: $${r.margin} per plate`});
    if(r.sales>0&&domPct>=35) reasons.push({cn:`主要买家：${dom.cn} 占 ${domPct}%`,en:`Main buyers: ${dom.en} — ${domPct}%`});
    if(reasons.length<2) reasons.push({cn:`人气 ${p.pop}/5，属于${p.pop>=4?'大众':'小众'}选择`,en:`Popularity ${p.pop}/5 — ${p.pop>=4?'mainstream':'niche'}`});
    if(r.sales===0) reasons.unshift({cn:'本季没有任何顾客点这道菜',en:'Nobody ordered this dish this quarter'});
    return {row:r,verdict,badge,badgeEn,reasons:reasons.slice(0,2),isHot,isCold,domPct};
  });
}

/* 顾问点评：先说结论，再讲做得好的 / 要改的，细节在下面 */
function advisorReport(res,season,prev){
  const rows=res.rows;
  const best=rows.slice().sort((a,b)=>b.cont-a.cont)[0];
  const worst=rows.slice().sort((a,b)=>a.cont-b.cont)[0];
  const totalCont=rows.reduce((a,r)=>a+Math.max(0,r.cont),0)||1;
  const goods=[],bads=[];
  const coldPicked=rows.filter(r=>season.cold[r.prod.id]);
  const hotPicked=rows.filter(r=>season.hot[r.prod.id]);

  if(res.lost>0){
    const names=res.segRows.filter(s=>s.lost>0).map(s=>s.seg.cn).join('、');
    bads.push({t:`${res.lost} 位客人没进门`,d:`${names} 整群流失`});
  }
  if(coldPicked.length){
    const c=coldPicked[0];
    bads.push({pid:c.prod.id,t:`${c.prod.cn} 是逆季菜`,d:`只卖出 ${c.sales} 份，白占一个槽`});
  }
  if(!hotPicked.length){
    bads.push({t:'一个当季热门都没上',d:'天然的客流红利让给了隔壁'});
  }
  const spike=rows.find(r=>season.cost[r.prod.id]>0);
  if(spike) bads.push({pid:spike.prod.id,t:`${spike.prod.cn} 这季涨价`,d:`每份毛利只剩 $${spike.margin}`});
  if(worst.sales<=res.active*0.05&&worst.prod.id!==best.prod.id){
    bads.push({pid:worst.prod.id,t:`${worst.prod.cn} 几乎没人点`,d:`${worst.sales} 份 · 占着 1/6 的菜单`});
  }

  if(res.lost===0) goods.push({t:'四类客人全到齐',d:'0 流失 · 三条硬规则守住了'});
  if(best.cont>0) goods.push({pid:best.prod.id,t:`${best.prod.cn} 撑起这一季`,d:`${best.sales} 份 · 贡献 ${money(best.cont)}（${Math.round(best.cont/totalCont*100)}%）`});
  if(hotPicked.length) goods.push({pid:hotPicked.slice(0,2).map(r=>r.prod.id),t:'踩中了当季热门',d:hotPicked.slice(0,2).map(r=>r.prod.cn).join('、')+' 需求被放大'});

  // 情绪分档：比上季好 / 持平 / 下滑；首季用目标线对照
  let say='';
  if(!prev){
    const over=res.net>=TARGET/4;
    say=over
      ? `漂亮的开局，<b class="up">${money(res.net)}</b>——四个季度平均每季 ${money(TARGET/4)} 就能跨过全年目标。`
      : `首季收工，账上 <b class="hl">${money(res.net)}</b>。四个季度每季平均 ${money(Math.round(TARGET/4))} 才能跨全年目标，先找到方向再谈提升。`;
    if(res.lost>0) say+=` 有 <b class="hl">${res.lost} 位客人</b>连门都没进——这是最该先修的。`;
  }else{
    const diff=res.net-prev.net;
    const over=res.net>=TARGET/4;
    if(diff>=300){
      say=`漂亮，这一季 <b class="up">${money(res.net)}</b>，比上季多赚 <b class="up">${money(diff)}</b>——你找到了这个季节的感觉。`;
    }else if(diff<=-400){
      say=`这一季掉到 <b class="hl">${money(res.net)}</b>，比上季少赚 <b class="hl">${money(-diff)}</b>。别急着换菜，先分清是客人少了还是菜单没跟上季节。`;
    }else{
      say=`这一季 <b class="${over?'up':'hl'}">${money(res.net)}</b>，比上季${diff>=0?'多赚':'少赚'} ${money(Math.abs(diff))}。`;
    }
    const aboveTargetEach=res.net>=TARGET/4;
    if(aboveTargetEach&&prev.net<TARGET/4) say+=` 好消息：这一季的利润已经跨过每季平均线 ${money(Math.round(TARGET/4))}。`;
    if(!aboveTargetEach&&prev.net>=TARGET/4) say+=` 注意：上季刚好踩线，这一季没守住——别让惯性菜单掉下来。`;
  }

  // 去重：good/bad 引用同一道菜时，保留负面
  const allBads=new Set();
  bads.forEach(b=>{ if(Array.isArray(b.pid)) b.pid.forEach(p=>allBads.add(p)); else if(b.pid) allBads.add(b.pid) });
  goods.forEach(g=>{
    const ids=Array.isArray(g.pid)?g.pid:g.pid?[g.pid]:[];
    if(ids.some(p=>allBads.has(p))) g.skip=true;
  });

  return {
    say,
    goods:goods.filter(g=>!g.skip).slice(0,3),
    bads:bads.slice(0,2),
    thumbs:rows.slice().sort((a,b)=>b.cont-a.cont).slice(0,3),
  };
}

   bodyEn:'Rising costs squeeze margins — substitute, or lean on high-margin dishes.'},
  {tag:'季节 · Season',title:'第 3 课 · 菜单跟着季节换',titleEn:'Lesson 3 · Seasonal Menus',
   body:'同一道菜，当季抢手、逆季没人点。每季重看一次菜单。',
   bodyEn:'Same dish, different season. Rethink the menu every quarter.'},
  {tag:'组合 · Mix',title:'第 4 课 · 六个槽位是一支球队',titleEn:'Lesson 4 · Six Slots, One Team',
   body:'六个最贵的菜放一起不等于最好。要覆盖四类客群，还要给热门留位置。',
   bodyEn:'Six top-margin dishes is not the answer. Cover four groups, leave room for hits.'},
];

function lessonsFor(menu,res,season,qi,prev){
  const cards=[CORE_LESSONS[qi]];
  const b=[];
  const push=(w,tag,title,titleEn,body,bodyEn,pos)=>b.push({w,tag,title,titleEn,body,bodyEn,pos:!!pos});
  const nf=countFish(menu);

  if(!hasFish(menu)){
    const lostSeg=res.segRows[0];
    push(100,'规则 · Rule','没有鱼 = 招牌没了','No Fish, No Signature',
      `海鲜餐厅的第一条承诺是"菜单里有鱼"。本季 ${Math.round(SEGMENTS[0].pct*100)}% 的海鲜慕名者整群没进门，流失 ${lostSeg.lost} 位顾客。`,
      `${Math.round(SEGMENTS[0].pct*100)}% of seafood seekers never walked in — ${lostSeg.lost} guests lost.`);
  } else if(nf<2){
    const vr=res.segRows[1];
    push(94,'规则 · Rule','一个鱼槽不够','One Fish Slot Is Not Enough',
      `常客（${Math.round(SEGMENTS[1].pct*100)}%）想看到选择。只有 1 个鱼槽，他们整群流失：${vr.lost} 位顾客。`,
      `Regulars (${Math.round(SEGMENTS[1].pct*100)}%) want choice. With one fish slot they all stayed away: ${vr.lost} guests lost.`);
  }
  const missing=CATEGORIES.filter(c=>!hasCat(menu,c));
  if(missing.length){
    const names=missing.map(c=>CAT_META[c].label).join(' / ');
    const lostN=res.lost;
    push(92,'规则 · Rule',`漏掉了 ${names}`,'A Missing Category',
      `每一类菜背后都有一整群客人。缺 ${names}，对应的客群一个都不会进门（本季共流失 ${lostN} 人）。`,
      `Each category serves a whole guest group. Without ${names}, that group never shows up (${lostN} guests lost).`);
  }
  const coldPicked=menu.filter(p=>season.cold[p.id]);
  if(coldPicked.length){
    const p=coldPicked[0];
    const row=res.rows.find(r=>r.prod.id===p.id);
    push(74,'季节 · Season',`${p.cn} 是逆季菜`,'Out-of-Season Pick',
      `你上了${p.cn}（${p.es}），这个季节几乎没人点，只卖出 ${row.sales} 份——槽位被浪费了。`,
      `${p.name} is out of season — only ${row.sales} sold. A wasted slot.`);
  }
  const hotIds=Object.keys(season.hot);
  if(!menu.some(p=>hotIds.includes(p.id))){
    const hotNames=hotIds.slice(0,3).map(id=>allProducts().find(x=>x.id===id).cn).join('、');
    push(70,'季节 · Season','一个当季热门都没上','Missed the Seasonal Wave',
      `本季热门（${hotNames}）本来会更抢手，你一个都没选——等于把天然客流让给了隔壁。`,
      `This season's hot dishes (${hotIds.length}) are yours for the taking. You picked none.`);
  }
  const spiked=Object.keys(season.cost).filter(id=>season.cost[id]>0&&menu.some(p=>p.id===id));
  if(spiked.length){
    const id=spiked[0],p=allProducts().find(x=>x.id===id);
    const row=res.rows.find(r=>r.prod.id===id);
    push(68,'成本 · Cost',`${p.cn} 涨价了`,'Cost Shock',
      `${p.cn} 本季成本 +$${season.cost[id]}，每份毛利只剩 $${row.margin}，却还占着 1/6 的菜单。要么换菜，要么靠其他菜补。`,
      `${p.name} costs $${season.cost[id]} more this season — margin now $${row.margin}.`);
  }
  const bestSales=res.rows.slice().sort((a,b)=>b.sales-a.sales)[0];
  const bestCont=res.rows.slice().sort((a,b)=>b.cont-a.cont)[0];
  if(bestSales.sales>0&&bestSales.margin<=6&&bestSales.prod.id!==bestCont.prod.id){
    push(76,'利润 · Margin',`${bestSales.prod.cn} 卖得多，赚得少`,'Busy But Broke',
      `${bestSales.prod.cn} 是本季销量冠军（${bestSales.sales} 份），但每份只赚 $${bestSales.margin}；真正贡献最多毛利的是${bestCont.prod.cn}。人气 ≠ 利润。`,
      `${bestSales.prod.name} sold the most (${bestSales.sales}) but earns only $${bestSales.margin} each. Popularity ≠ profit.`);
  }
  const fat=res.rows.filter(r=>r.margin>=9).sort((a,b)=>b.margin-a.margin)[0];
  if(fat&&fat.sales>0&&fat.sales<res.active*0.08){
    push(72,'利润 · Margin',`${fat.prod.cn} 毛利高，却没人点`,'High Margin, No Traffic',
      `${fat.prod.cn} 每份赚 $${fat.margin}，本季只卖出 ${fat.sales} 份。高毛利必须靠销量兑现，否则只是纸面数字。`,
      `${fat.prod.name} earns $${fat.margin} per plate but sold only ${fat.sales}.`);
  }
  const avgPrice=menu.reduce((a,p)=>a+p.price,0)/6;
  if(avgPrice>=15.5){
    push(66,'定价 · Price',`整体定价偏高（均价 $${avgPrice.toFixed(0)}）`,'Priced Too High',
      `价格明显高于平均线，客人看一眼菜单就走了。高价需要"值得"来支撑。`,
      `Prices sit well above average — guests glance and leave.`);
  } else if(avgPrice<=8.5){
    push(60,'定价 · Price',`客单价太低（均价 $${avgPrice.toFixed(0)}）`,'Too Cheap',
      `你卖得很多，但每份留下的钱太少。便宜能带来人流，不一定带来利润。`,
      `Plenty of orders, little left per plate. Cheap fills seats, not always the till.`);
  }
  const topCont=res.rows.slice().sort((a,b)=>b.cont-a.cont)[0];
  if(topCont.cont>0&&topCont.cont/res.rows.reduce((a,r)=>a+Math.max(0,r.cont),0)>.36){
    push(55,'组合 · Mix',`靠 ${topCont.prod.cn} 撑起整家店`,'One-Hero Menu',
      `${topCont.prod.cn} 贡献了本季 ${Math.round(topCont.cont/res.rows.reduce((a,r)=>a+Math.max(0,r.cont),0)*100)}% 的毛利。它一旦涨价或缺货，整家店都跟着晃。`,
      `${topCont.prod.name} carries the whole quarter. Risky.`);
  }
  const dead=res.rows.filter(r=>r.sales<=res.active*0.05)[0];
  if(dead) push(58,'组合 · Mix',`${dead.prod.cn} 成了僵尸槽位`,'Dead Slot',
    `${dead.prod.cn} 只卖出 ${dead.sales} 份，却占着 1/6 的菜单资源。六个槽位很贵，每一个都该有用。`,
    `${dead.prod.name} sold ${dead.sales} while eating one of six slots.`);

  if(prev&&res.net<prev.net*0.85){
    push(62,'趋势 · Trend','环比明显下滑','Down Quarter',
      `比上一季少了 ${money(prev.net-res.net)}（−${Math.round((1-res.net/prev.net)*100)}%）。先分清：是客流变了，还是菜单没跟上？`,
      `${money(prev.net-res.net)} less than last quarter. Was it traffic or the menu?`);
  }
  if(res.lost===0){
    push(45,'顾客 · Guests','四类顾客全部到齐','Full House',
      '0 流失！三条硬规则全部满足——这是入场券。真正的较量，是谁能用同样的客流赚更多。',
      'Zero lost guests. The three rules are the ticket; profit is the game.',true);
  }
  if(res.net>=season.strong){
    push(50,'成绩 · Result','创下季度新高','Record Quarter',
      `本季 ${money(res.net)}，达到 Maketto 的"强势季度"标准。把这套组合记下来，下一季对比着用。`,
      `${money(res.net)} — a strong quarter. Remember this mix.`,true);
  }
  b.sort((x,y)=>y.w-x.w);
  const picked=b.slice(0,3);
  if(!picked.some(c=>c.pos)){
    const pos=b.find(c=>c.pos&&!picked.includes(c));
    if(pos&&picked.length<3)picked.push(pos);
  }
  return [cards[0],...picked];
}

const app=document.getElementById('app');
function render(){
  updateProgress();
  if(state.screen==='intro')renderIntro();
  else if(state.screen==='rules')renderRules();
  else if(state.screen==='decision')renderDecision();
  else if(state.screen==='settle')renderSettle();
  else if(state.screen==='finale')renderFinale();
}

function updateProgress(){
  const bar=document.getElementById('qProgress');
  if(state.screen==='intro'||state.screen==='rules'||state.screen==='finale'){bar.style.display='none';return}
  bar.style.display='flex';
  for(let i=1;i<=4;i++)document.getElementById('qp'+i).className='qp-dot';
  for(let i=1;i<=3;i++)document.getElementById('qpl'+i).className='qp-line';
  if(state.screen==='decision'){
    document.getElementById('qp'+(state.quarterIdx+1)).classList.add('active');
    for(let i=1;i<=state.quarterIdx;i++){document.getElementById('qp'+i).classList.add('done');document.getElementById('qpl'+i).classList.add('done')}
  } else if(state.screen==='settle'){
    for(let i=1;i<=state.quarterIdx+1;i++)document.getElementById('qp'+i).classList.add('done');
    for(let i=1;i<=Math.min(state.quarterIdx+1,3);i++)document.getElementById('qpl'+i).classList.add('done');
  }
}

        <div class="cost-changes">
          <h5>🍂 ${season.cn} 食材成本变动</h5>
          ${Object.entries(season.cost).map(([pid,delta])=>{const p=allProducts().find(x=>x.id===pid);return `<div class="cc-row"><span class="prod">${p.cn} <span class="es">${p.es}</span></span><span class="delta ${delta>0?'up':'down'}">${delta>0?'↑ +':'↓ '}$${Math.abs(delta)}</span></div>`}).join('')}
        </div>`:''}

        <div class="decision-actions">
          <button class="btn-card" onclick="clearAllSlots()">清空</button>
          <button class="btn-submit" ${state.slots.some(s=>s===null)?'disabled':''} onclick="submitMenu()">${state.slots.some(s=>s===null)?'填满 6 槽':'提交本季菜单 →'}</button>
        </div>
      </div>

      <div class="product-tray">
        <h4>🛒 产品清单 · 拖入槽位</h4>
        ${CATEGORIES.map(cat=>`
          <div class="pt-category">
            <div class="pt-cat-name">${CAT_META[cat].emoji} ${CAT_META[cat].label} · ${CAT_META[cat].en}</div>
            <div class="pt-grid">
              ${PRODUCTS[cat].map(p=>{
                const cost=p.cost+(season.cost[p.id]||0);
                const margin=p.price-cost;
                const used=state.slots.includes(p);
                return `<div class="pt-item ${used?'used':''}" draggable="${used?'false':'true'}" data-pid="${p.id}" data-cat="${cat}" ondragstart="onDragStart(event,'${cat}','${p.id}')" ondragend="onDragEnd(event)" onclick="pickProduct('${cat}','${p.id}')">
                  <img src="${FOOD+p.img}" onerror="this.style.opacity='.3'">
                  <div class="pt-info">
                    <div class="pt-name">${p.cn}</div>
                    <div class="pt-meta">$${p.price} · 毛利 <b>+$${margin}</b></div>
                    <div class="pt-stars">${stars(p.pop)}</div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;

  document.querySelectorAll('.slot').forEach((sl,i)=>{
    sl.addEventListener('dragover',e=>{e.preventDefault();sl.classList.add('drag-over')});
    sl.addEventListener('dragleave',()=>sl.classList.remove('drag-over'));
    sl.addEventListener('drop',e=>{
      e.preventDefault();sl.classList.remove('drag-over');
      const pid=e.dataTransfer.getData('text/plain');
      const cat=e.dataTransfer.getData('cat');
      if(pid&&cat){
        const prod=PRODUCTS[cat].find(x=>x.id===pid);
        if(prod){
          if(state.dragFromSlot>=0){state.slots[state.dragFromSlot]=null;state.dragFromSlot=-1}
          state.slots[i]=prod;
          renderDecision();
        }
      }
    });
  });

  document.querySelectorAll('.slot.filled').forEach(sl=>{
    const i=Number(sl.dataset.slot);
    sl.setAttribute('draggable','true');
    sl.addEventListener('dragstart',e=>{
      state.dragFromSlot=i;
      e.dataTransfer.setData('text/plain',state.slots[i].id);
      e.dataTransfer.setData('cat',productCat(state.slots[i]));
      sl.classList.add('dragging');
    });
    sl.addEventListener('dragend',()=>{state.dragFromSlot=-1;sl.classList.remove('dragging')});
  });

  const newTray=document.querySelector('.product-tray');
  if(newTray&&keepScroll)newTray.scrollTop=keepScroll;
  if(keepPage)window.scrollTo(0,keepPage);
}

function renderSlotsHTML(season){
  return state.slots.map((slot,i)=>{
    if(!slot) return `<div class="slot empty" data-slot="${i}">
      <div class="slot-label">Slot ${i+1}</div>
      <div class="slot-icon">+</div>
      <div class="slot-num">拖放产品</div>
    </div>`;
    const cat=productCat(slot);
    const cost=slot.cost+(season.cost[slot.id]||0);
    const margin=slot.price-cost;
    return `<div class="slot filled" data-slot="${i}">
      <div class="slot-label">Slot ${i+1} · ${CAT_META[cat].label}</div>
      <button class="slot-remove" onclick="event.stopPropagation();removeSlot(${i})">✕</button>
      <img class="slot-img" src="${FOOD+slot.img}" onerror="this.style.background='var(--ivory2)'">
      <div class="slot-info">
        <div class="slot-name">${slot.cn}</div>
        <div class="slot-margin">+$${margin}</div>
      </div>
    </div>`;
  }).join('');
}

function sideGoal(){
  const yearSoFar=state.history.reduce((s,h)=>s+h.net,0);
  const pct=Math.min(100,yearSoFar/TARGET*100);
  return `<div class="side-goal">
    <div class="sg-title">🎯 年度进度</div>
    <div class="sg-target">${money(yearSoFar)} <span style="font-size:13px;color:#7B5E00;font-weight:500">/ $${TARGET.toLocaleString()}</span></div>
    <div class="sg-bar"><div class="sg-fill" style="width:${pct}%"></div></div>
    <div class="sg-league">目前：${leagueFor(yearSoFar).title}</div>
  </div>`;
}

/* ===== SETTLE ===== */
function renderSettle(){
  const season=SEASONS[state.quarterIdx];
  const result=state.history[state.quarterIdx];
  const prev=state.quarterIdx>0?state.history[state.quarterIdx-1]:null;
  document.getElementById('tbQuarterSub').textContent=season.key+' '+season.cn+' · Results';

  const why=explainSlots(result,season);
  const adv=advisorReport(result,season,prev);
  const lessons=lessonsFor(result.menu,result,season,state.quarterIdx,prev);
  const maxCont=Math.max(...result.rows.map(s=>Math.abs(s.cont)),1);
  const bestCont=Math.max(...result.rows.map(s=>s.cont));
  const bestRow=result.rows.reduce((a,b)=>b.cont>a.cont?b:a);

  app.innerHTML=`
  <div class="fade-in">
    <div class="settle-top">
      <div class="st-card kpi">
        <div class="st-label">${season.key} · 本季 Net Revenue</div>
        <div class="st-value count-pop">${money(result.net)}</div>
        <div class="st-sub">流失 ${result.lost} · 来店 ${result.active}/${result.flow}</div>
      </div>
      <div class="st-card">
        <div class="st-label">Lost Patrons · 流失顾客</div>
        <div class="st-value" style="color:${result.lost>0?'var(--coral-d)':'var(--herb)'}">${result.lost}</div>
        <div class="st-sub">${result.lost>0?'有客群整群没进门':'四类顾客全部到齐'}</div>
      </div>
      <div class="st-card">
        <div class="st-label">Best Slot · 最佳槽位</div>
        <div class="st-value" style="color:var(--herb)">${money(bestRow.cont)}</div>
        <div class="st-sub">${bestRow.prod.cn}</div>
      </div>
    </div>

    <div class="advisor">
      <div class="adv-avatar">🧑‍🍳</div>
      <div class="adv-body">
        <div class="adv-name">Maketto 顾问 · Chef Advisor</div>
        <div class="adv-say">${adv.say}</div>
        <div class="adv-cols">
          <div class="adv-col good">
            <h5>✔ 这一季做对的</h5>
            ${adv.goods.map(g=>`<div class="adv-li"><span class="dot">▪</span><div><b>${g.t}</b><br>${g.d}</div></div>`).join('')}
          </div>
          <div class="adv-col bad">
            <h5>✎ 下一季先改这个</h5>
            ${adv.bads.length
              ? adv.bads.map(g=>`<div class="adv-li"><span class="dot">▪</span><div><b>${g.t}</b><br>${g.d}</div></div>`).join('')
              : `<div class="adv-li"><span class="dot">▪</span><div><b>没有明显短板</b><br>换更强的组合，去冲更高档位。</div></div>`}
          </div>
        </div>
        <div class="adv-thumbs">
          ${adv.thumbs.map(r=>`<img class="adv-thumb" src="${FOOD+r.prod.img}" alt="${r.prod.cn}" onerror="this.style.display='none'">`).join('')}
          <span class="adv-thumb-cap">本季贡献最高的三道菜</span>
        </div>
      </div>
    </div>

    <div class="settle-section">
      <div class="ss-title">👥 四类顾客：来店 vs 流失</div>
      <div class="segments">
        ${result.segRows.map(sr=>`
          <div class="seg-card ${sr.lost>0?'lost':'active'}">
            <div class="seg-emoji">${sr.seg.emoji}</div>
            <div class="seg-name">${sr.seg.cn}</div>
            <div class="seg-cn">${sr.seg.en}</div>
            <div class="seg-count count-pop">${sr.cnt>0?sr.cnt:'—'}</div>
            <div class="seg-reason">${sr.lost>0?sr.seg.whyCn:'来店 ✓'}</div>
            <div class="seg-bar"><div class="seg-bar-fill" style="width:${sr.cnt>0?100:0}%"></div></div>
          </div>`).join('')}
      </div>
    </div>

    <div class="settle-section">
      <div class="ss-title">🔍 每道菜为什么好卖 / 为什么卖不动</div>
      <div class="why-grid">
        ${why.map(w=>`
          <div class="why-card ${w.verdict}">
            <img src="${FOOD+w.row.prod.img}" onerror="this.style.display='none'">
            <div class="wc-main">
              <div class="wc-top"><span class="wc-name">${w.row.prod.cn}</span><span class="wc-badge ${w.verdict}">${w.badge}</span></div>
              <div class="wc-es">${w.row.prod.es}</div>
              <div class="wc-stat">销量 ${w.row.sales} · 毛利 $${w.row.margin}/份 · 贡献 ${money(w.row.cont)}</div>
              <div class="wc-reason">${w.reasons.map(r=>r.cn).join('；')}。</div>
              <div class="wc-reason-en">${w.reasons.map(r=>r.en).join('; ')}.</div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="settle-section">
      <div class="ss-title">🎓 本季商业知识点 · Business Takeaways</div>
      <div class="lesson-grid">
        ${lessons.map((l,i)=>`
          <div class="lesson-card ${i===0?'core':''}">
            <span class="lc-star">${i===0?'📘':'💡'}</span>
            <span class="lc-tag">${l.tag}</span>
            <div class="lc-title">${l.title}<span class="en">${l.titleEn}</span></div>
            <div class="lc-body">${l.body}<span class="bi-en">${l.bodyEn}</span></div>
          </div>`).join('')}
      </div>
    </div>

    <div class="settle-section">
      <div class="ss-title">📊 槽位贡献 · Visual Ranking</div>
      <div class="bar-chart">
        <h4>Contribution by Slot · 每道菜贡献的毛利</h4>
        <div class="bars-wrap">
          ${result.rows.map(s=>`
            <div class="bar-item">
              <div class="bar ${s.cont===bestCont?'is-best':''}" data-h="${Math.max(4,Math.abs(s.cont)/maxCont*170)}" style="height:4px">
                <div class="bar-value">${money(s.cont)}</div>
              </div>
              <div class="bar-label">${s.prod.cn}</div>
              <div class="bar-rev">$${s.margin} × ${s.sales}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="settle-section">
      <div class="ss-title">📋 详细数据 · Slot Breakdown</div>
      <table class="slot-table">
        <thead><tr><th>#</th><th>Img</th><th>产品 · Product</th><th>售价</th><th>成本</th><th>Margin</th><th>销量</th><th>总贡献</th></tr></thead>
        <tbody>
          ${result.rows.map((r,i)=>`<tr class="${r.cont===bestCont?'highlight-row':''}">
            <td>${i+1}</td><td class="p-img-cell"><img src="${FOOD+r.prod.img}" onerror="this.style.display='none'"></td>
            <td><b>${r.prod.cn}</b> <span class="es">${r.prod.es}</span></td>
            <td class="num">$${r.prod.price}</td><td class="num">$${r.cost}</td>
            <td class="num pos">+$${r.margin}</td><td class="num">${r.sales}</td>
            <td class="num ${r.cont>=0?'pos':'neg'}"><b>${money(r.cont)}</b></td></tr>`).join('')}
          <tr style="background:var(--ocean-mist);font-weight:700">
            <td colspan="7" style="text-align:right;padding-right:14px;font-size:10px;color:var(--ocean);letter-spacing:1px;text-transform:uppercase">固定运营成本 · Fixed Cost</td>
            <td class="num" style="color:var(--coral)">−$${FIXED_COST}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="settle-actions">
      ${state.quarterIdx<3
        ? `<button class="btn-submit" onclick="nextQuarter()">进入 Q${state.quarterIdx+2} ${SEASONS[state.quarterIdx+1].cn} →</button>`
        : `<button class="btn-submit" onclick="showFinale()">查看全年总结 🏆</button>`}
    </div>
  </div>`;

  setTimeout(()=>{
    document.querySelectorAll('.bar[data-h]').forEach(el=>{el.style.height=el.dataset.h+'px'});
  },80);
}

/* ===== FINALE ===== */
function renderFinale(){
  const yearRev=state.history.reduce((s,h)=>s+h.net,0);
  const yearLost=state.history.reduce((s,h)=>s+h.lost,0);
  const bestQ=state.history.slice().sort((a,b)=>b.net-a.net)[0];
  const maxRev=Math.max(...state.history.map(h=>h.net),1);
  const league=leagueFor(yearRev);

  app.innerHTML=`
  <div class="fade-in">
    <div class="finale-hero">
      <div class="fh-kick">Year-End · 全年总结</div>
      <div class="fh-title">四季经营完结</div>
      <div class="fh-sub">Four Quarters · One Restaurant · One Menu</div>
      <div class="fh-reward">
        <div class="fh-medal star-pop">${league.stars}</div>
        <div class="fh-league">${league.title}</div>
        <div class="fh-league-sub en">${league.en}</div>
        <div style="font-size:12px;opacity:.8;margin-top:6px">${league.desc}</div>
      </div>
      <div class="fh-kpi">
        <div class="fh-kpi-item"><div class="v">${money(yearRev)}</div><div class="l">Total Net Revenue</div></div>
        <div class="fh-kpi-item"><div class="v">${yearLost}</div><div class="l">Total Lost Patrons</div></div>
        <div class="fh-kpi-item best"><div class="v">${money(bestQ.net)}</div><div class="l">Best · ${SEASONS[bestQ.quarterIdx].key}</div></div>
      </div>
    </div>

    <div class="league-ladder">
      <h4>🏆 Maketto 荣誉阶梯 · League Ladder</h4>
      <div class="ladder-bar">
        ${LEAGUES.map((l,i)=>`
          <div class="ladder-node ${l.min<=yearRev&&yearRev<=l.max?'active':''} ${yearRev>=l.min?'reached':''}" style="flex:1">
            <div class="ln-medal">${l.stars}</div>
            <div class="ln-title">${l.title}</div>
            <div class="ln-sub">${l.en}</div>
            <div class="ln-range">${l.min===0?'起点':l.max<99999?'$'+l.min.toLocaleString():'传奇'}</div>
          </div>${i<LEAGUES.length-1?'<div class="ladder-connector"></div>':''}
        `).join('')}
      </div>
    </div>

    <div class="ss-title" style="margin-top:24px">📅 四季回顾</div>
    <div class="q-summary">
      ${state.history.map(h=>`
        <div class="qs-card">
          <div class="qs-qtr">${SEASONS[h.quarterIdx].key} · ${SEASONS[h.quarterIdx].en}</div>
          <div class="qs-sname">${SEASONS[h.quarterIdx].cn}</div>
          <div class="qs-rev">${money(h.net)}</div>
          <div class="qs-bar"><div class="qs-bar-fill" style="height:${Math.max(4,h.net/maxRev*46)}px;background:${h.net===maxRev?'var(--gold)':'var(--ocean)'}"></div></div>
          <div class="qs-lost">流失 <b>${h.lost}</b> · 来店 ${h.active}</div>
        </div>`).join('')}
    </div>

    <div class="ss-title" style="margin-top:28px">📚 你这一局学到的知识点</div>
    <div class="recap-grid">
      ${[...new Map(state.lessons.map(l=>[l.title,l])).values()].slice(0,6).map(l=>`
        <div class="recap-card">
          <div class="recap-tag">${l.tag}</div>
          <h4>${l.title}</h4>
          <p>${l.body}</p>
          <p class="bi-en" style="margin-top:4px">${l.bodyEn}</p>
        </div>`).join('')}
    </div>

    <div class="settle-actions" style="margin-top:36px">
      <button class="btn-card" onclick="resetGame()">↻ 换一套打法再来一局</button>
    </div>
  </div>`;
  document.getElementById('tbQuarterSub').textContent='Year-End Recap';
}

/* ============ ACTIONS ============ */
function onDragStart(e,cat,pid){
  const used=state.slots.some(s=>s&&s.id===pid);
  if(used){e.preventDefault();return}
  e.dataTransfer.setData('text/plain',pid);
  e.dataTransfer.setData('cat',cat);
  e.dataTransfer.effectAllowed='copy';
  e.currentTarget.classList.add('dragging');
}
function onDragEnd(e){e.currentTarget.classList.remove('dragging')}

function pickProduct(cat,pid){
  const prod=PRODUCTS[cat].find(x=>x.id===pid);
  if(state.slots.some(s=>s&&s.id===pid))return;
  const target=state.slots.findIndex(s=>s===null);
  if(target>=0){state.slots[target]=prod;renderDecision()}
}
function removeSlot(i){state.slots[i]=null;renderDecision()}
function clearAllSlots(){state.slots=[null,null,null,null,null,null];renderDecision()}
function submitMenu(){
  if(state.slots.some(x=>x===null))return;
  const season=SEASONS[state.quarterIdx];
  const sc=scenarioFor(state.quarterIdx);
  const menu=state.slots.slice();
  const r=simulate(menu,season,sc.adj);
  r.quarterIdx=state.quarterIdx;
  r.menu=menu;
  r.adj=sc.adj;
  state.history.push(r);
  const prev=state.quarterIdx>0?state.history[state.quarterIdx-1]:null;
  const lessons=lessonsFor(menu,r,season,state.quarterIdx,prev);
  lessons.forEach(l=>{
    if(!state.lessons.some(x=>x.title===l.title)){
      state.lessons.push({tag:l.tag,title:l.title,body:l.body,bodyEn:l.bodyEn});
    }
  });
  state.screen='settle';
  render();
}
function goRules(){state.screen='rules';render()}
function setRulesMode(v){state.rulesAdv=v;renderRules()}
function startGame(){state.screen='decision';state.quarterIdx=0;state.slots=[null,null,null,null,null,null];state.history=[];state.lessons=[];render()}
function nextQuarter(){state.quarterIdx++;state.slots=[null,null,null,null,null,null];state.screen='decision';render()}
function showFinale(){state.screen='finale';render()}
function resetGame(){state={screen:'intro',quarterIdx:0,slots:[null,null,null,null,null,null],history:[],dragFromSlot:-1,lessons:[],rulesAdv:false};document.body.classList.remove('rules-adv');render()}

render();
</script>
